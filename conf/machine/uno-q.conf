#@TYPE: Machine
#@NAME: Arduino UNO Q
#@DESCRIPTION: Machine configuration for Arduino UNO Q

MACHINEOVERRIDES =. "arduino:"

PREFERRED_PROVIDER_virtual/kernel ?= "linux-qcom-next"

require conf/machine/include/qcom-qcm2290.inc

MACHINE_FEATURES = "efi usbhost usbgadget alsa wifi bluetooth"

UBOOT_CONFIG = "qrb2210-arduino-imola"
UBOOT_CONFIG[qrb2210-arduino-imola] = "qcom_defconfig"
UBOOT_INITIAL_ENV = ""

QCOM_DTB_DEFAULT ?= "qrb2210-arduino-imola"

KERNEL_DEVICETREE ?= " \
                      qcom/qrb2210-arduino-imola.dtb \
                      "

KERNEL_CMDLINE_EXTRA += "deferred_probe_timeout=30"

MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += " \
    kernel-module-anx7625 \
    packagegroup-uno-q-firmware \
    packagegroup-uno-q-hexagon-dsp-binaries \
"

# Pull in the networkmanager empty meta-package so its RRECOMMENDS
# fan-out (networkmanager-wifi, networkmanager-bluetooth, ...) lands
# in the rootfs for any image built against this machine. Without
# this, images derived from core-image-base install
# networkmanager-daemon directly via packagegroup-foundries / similar
# and the plugin sub-packages never get pulled, leaving the board
# with a wifi radio that comes up but no userspace to associate.
# Soft RRECOMMENDS so images that prefer connman/iwd/systemd-networkd
# alone can opt out via BAD_RECOMMENDATIONS.
MACHINE_EXTRA_RRECOMMENDS += "networkmanager"

QCOM_CDT_FILE = "cdt"

QCOM_BOOT_FILES_SUBDIR = "qrb2210-arduino-imola"
QCOM_PARTITION_FILES_SUBDIR ?= "partitions/qrb2210-unoq/emmc-16GB"

QCOM_BOOT_FIRMWARE = "firmware-qcom-boot-qrb2210-arduino-imola"
