# LOCAL-ONLY weston.ini for Rubik Pi 3: DRM-backed Weston for HDMI output.
# A separate weston-rdp.service runs a second Weston with the RDP backend
# bound to port 3389 — see /lib/systemd/system/weston-rdp.service.
#
# Connect from LAN with:   xfreerdp /v:<board-ip>:3389 /u:weston /p:weston +clipboard
[core]
idle-time=0
xwayland=true
backend=drm-backend.so
require-input=false
repaint-window=10
require-outputs=none
