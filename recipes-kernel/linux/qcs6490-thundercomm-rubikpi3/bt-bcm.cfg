# Enable Broadcom UART HCI for BCM4345C5 on Rubik Pi 3 (AP6256 module).
# The brcm,bcm4345c5 DT compatible is already wired in mainline
# qcs6490-thundercomm-rubikpi3.dts to UART7 (qup_uart7); this fragment just
# builds in the protocol-layer driver.
CONFIG_BT_HCIUART=y
CONFIG_BT_HCIUART_BCM=y
CONFIG_BT_HCIUART_SERDEV=y
CONFIG_SERIAL_DEV_BUS=y
CONFIG_SERIAL_DEV_CTRL_TTYPORT=y
